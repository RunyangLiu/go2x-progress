name: Sync Go2X progress

on:
  workflow_dispatch:
  schedule:
    - cron: "20 13 * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - "progress/codex-observations.json"
      - "scripts/**"
      - "docs/index.html"
      - "docs/app.js"
      - "docs/styles.css"
      - "docs/architecture.html"
      - ".github/workflows/progress.yml"
      - "package.json"

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: go2x-progress
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize Issues and progress data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-progress.mjs

      - name: Validate generated artifacts
        run: node scripts/validate-progress.mjs

      - name: Commit synchronized data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md progress/progress.json docs/progress.json
          if git diff --cached --quiet; then
            echo "Progress data is already current."
          else
            git commit -m "chore: sync progress"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

