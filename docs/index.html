<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Go2X 二次开发进展</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="appbar__identity">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">UNITREE GO2X</p>
          <h1>二次开发进展</h1>
        </div>
      </div>
      <a class="repo-link" id="repo-link" href="https://github.com/RunyangLiu/go2x-progress">GitHub</a>
    </header>

    <main>
      <section class="summary-band" aria-labelledby="summary-title">
        <div class="summary-band__heading">
          <div>
            <p class="eyebrow">CURRENT STATUS</p>
            <h2 id="summary-title">项目总览</h2>
          </div>
          <p class="updated-at" id="updated-at">正在同步...</p>
        </div>

        <div class="summary-grid" id="summary-grid" aria-live="polite"></div>

        <div class="completion">
          <div class="completion__label">
            <span>整体完成度</span>
            <strong id="completion-value">--</strong>
          </div>
          <div class="progress-track" role="progressbar" aria-label="整体完成度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="progress-fill"></span>
          </div>
        </div>

        <p class="research-direction" id="research-direction"></p>
      </section>

      <section class="content-section" aria-labelledby="work-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">WORK ITEMS</p>
            <h2 id="work-title">研发工作项</h2>
          </div>
          <div class="segmented" id="status-filter" role="group" aria-label="进度筛选">
            <button class="is-active" type="button" data-status="all">全部</button>
            <button type="button" data-status="doing">进行中</button>
            <button type="button" data-status="blocked">阻塞</button>
            <button type="button" data-status="done">已完成</button>
            <button type="button" data-status="planned">计划</button>
          </div>
        </div>

        <div class="work-list" id="work-list" aria-live="polite">
          <p class="state-message">正在读取 GitHub 进展...</p>
        </div>
      </section>

      <section class="content-section architecture-section" aria-labelledby="architecture-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">SYSTEM MAP</p>
            <h2 id="architecture-title">Go2X 二次开发架构</h2>
          </div>
          <a class="text-link" href="architecture.html">独立查看</a>
        </div>
        <iframe class="architecture-frame" src="architecture.html" title="Go2X 二次开发交互式架构图" loading="lazy"></iframe>
      </section>

      <section class="content-section" aria-labelledby="activity-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">REPOSITORY SIGNALS</p>
            <h2 id="activity-title">最近更新</h2>
          </div>
          <a class="text-link" id="quality-link" href="https://github.com/RunyangLiu/go2x-progress/actions">自动检查</a>
        </div>
        <div class="activity-list" id="activity-list">
          <p class="state-message">等待仓库提交记录...</p>
        </div>
      </section>
    </main>

    <footer>
      <span id="source-policy">进展数据仅包含脱敏摘要。</span>
      <a href="https://github.com/RunyangLiu/go2x-progress/issues">Issues</a>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
